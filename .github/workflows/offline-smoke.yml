name: Offline smoke tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Compile Python files
        run: python -m compileall -q src tests scripts
      - name: Check safety and core offline behavior
        env:
          TRADING_MODE: paper
          ENABLE_LIVE_TRADING: 'false'
        run: pytest -q -o addopts='' tests/test_mode_guard.py tests/test_risk_engine.py tests/test_paper_trader.py tests/test_bybit_auth.py tests/test_bybit_client.py tests/test_market_data.py tests/test_backtest_engine.py
